name: HCP Terraform plan (labeled PRs)

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]

# No permissions by default; the job requests only what it needs.
permissions: {}

# One plan per PR at a time. The label state is part of the key, so an event
# without the deploy label can never cancel a running plan.
concurrency:
  group: tfc-plan-pr-${{ github.event.pull_request.number }}-${{ contains(github.event.pull_request.labels.*.name, 'aws-deploy:automation-05') }}
  cancel-in-progress: true

jobs:
  speculative-plan:
    # Run only when the PR carries the deploy label AND comes from this
    # repository (fork PRs get no secrets, and their code must never run with
    # AWS credentials). Any event on a labeled PR re-runs the plan; removing
    # the label re-evaluates the check to skipped (success).
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'aws-deploy:automation-05')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read # check out the code
      pull-requests: write # post the summary comment
    env:
      TF_CLOUD_ORGANIZATION: abbas-test
      TF_WORKSPACE: ec2-automation-05
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run a speculative plan in HCP Terraform
        id: plan
        env:
          TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
          RUN_MESSAGE: "PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.head.sha }} (speculative)"
          SUMMARY_FILE: ${{ runner.temp }}/tfc-plan-summary.md
        run: bash .github/scripts/tfc-speculative-plan.sh

      - name: Comment on the PR (counts and link only)
        if: ${{ !cancelled() && steps.plan.outputs.summary_file != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUMMARY_FILE: ${{ steps.plan.outputs.summary_file }}
        run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$SUMMARY_FILE" --edit-last --create-if-none
